[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roll-qr-scale"
version = "0.2.0rc84"
description = "Capture a roll QR code and bind it to a scale reading."
requires-python = ">=3.11"
dependencies = [
    "cryptography==50.0.0",
    "rapidocr==3.10.0",
    "onnxruntime==1.31.0",
    "numpy==2.4.6",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.2.0",
    "pydantic==2.13.4",
    "pyserial==3.5",
    "zxing-cpp==3.1.1",
]

[project.optional-dependencies]
legacy-ai = ["google-genai==2.16.0"]
test = [
    "pytest==9.0.3",
    "qrcode[pil]==8.2",
]
build = [
    "pyinstaller==6.21.0",
]
antigravity = [
    "google-antigravity==0.1.16",
]

[project.scripts]
roll-qr-scale = "roll_qr_scale.app:main"
roll-lookup = "roll_qr_scale.lookup:main"
roll-test-ui = "roll_qr_scale.test_ui:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
tramcan_rapidocr = ["model_sources.json"]
